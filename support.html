<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Contact support</title>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style type="text/css">
        html, body { 
            margin: 0; 
            height: 100%; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        site-footer {
            flex-shrink: 0;
        }
        .logo-header {
            text-align: center;
            padding: 20px;
            background: #fff;
        }
        .logo-header img {
            height: 60px;
            width: auto;
        }
        .form-container {
            flex: 1;
            position: relative;
        }
        iframe { 
            position: absolute; 
            top: 0; 
            right: 0; 
            bottom: 0; 
            left: 0; 
            border: 0; 
        }
    </style>
</head>
<body>
    <div class="logo-header">
        <a href="/">
            <img src="logo.png" alt="Petit chat">
        </a>
    </div>
    <div class="form-container">
        <iframe data-tally-src="https://tally.so/r/nGNlOp?transparentBackground=1" width="100%" height="100%" frameborder="0"
                marginheight="0" marginwidth="0" title="Contact support">
        </iframe>
    </div>

    <script src="components/site-footer.js"></script>
    <site-footer></site-footer>
</body>
</html>
